<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <title>Graph</title>
    <script src="https://cdn.plot.ly/plotly-4.1.1.min.js"></script>
  </head>
<style>
header h1, header nav {
    display: inline-block;
}
header h1 {
    font-size: medium;
    margin-left: 10px;
    margin-right: 15px;
}

header {
  background-color: #ff9900;
  color: white;
  padding: 10px;
  margin-bottom: 20px;
}

header a {
  color: white;
  text-decoration: none;
  margin: 0 5px;
}

header a:hover {
  color: #ffff99;
}

.current {
  color: #ffff00;
  font-weight: bold;
}
</style>
<body>
<header>
  <h1>비트코인 천만원 투자</h1>
  <nav>
    <a href="index.html">투자내역</a>
    <a href="bitcoin_price.html" class="current">비트코인 반감기와 가격</a>
    <a href="https://www.youtube.com/@bitcoin-1000" target="_blank">유튜브 채널</a>
  </nav>
</header>
    <div class="chart" id="graph"></div>
    <ul>
      <li>다음 반감기 예상일: <span id="next-halving">-</span></li>
      <li>업데이트 시간: <span id="updated-at">-</span></li>
    </ul>

    <script>
      const MS_PER_DAY = 24 * 60 * 60 * 1000;
      const HALVING_DATES = [
        '2012-11-28',
        '2016-07-09',
        '2020-05-11',
        '2024-04-20',
      ];

      function parseUtcDate(str) {
        const [y, m, d] = str.split('-').map(Number);
        return new Date(Date.UTC(y, m - 1, d));
      }

      function formatUtcDate(date) {
        return date.toISOString().slice(0, 10);
      }

      function addDays(date, days) {
        return new Date(date.getTime() + days * MS_PER_DAY);
      }

      function diffDays(d1, d2) {
        return Math.round((d2.getTime() - d1.getTime()) / MS_PER_DAY);
      }

      function parseCsv(text) {
        const rows = [];
        const lines = text.trim().split(/\r?\n/);
        for (let i = 1; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!line) continue;
          const parts = line.split(',');
          const date = parts[0];
          const close = Number(parts[1]);
          if (date && Number.isFinite(close)) {
            rows.push([date, close]);
          }
        }
        return rows;
      }

      function buildChart(rows, nextHalvingStr) {
        const dates = rows.map(r => r[0]);
        const closes = rows.map(r => r[1]);
        let minClose = Infinity;
        let maxClose = -Infinity;
        for (const c of closes) {
          if (c < minClose) minClose = c;
          if (c > maxClose) maxClose = c;
        }

        const halvingDatetimes = HALVING_DATES.map(parseUtcDate);
        const dtNext = parseUtcDate(nextHalvingStr);

        const dts = [parseUtcDate('2009-01-03'), ...halvingDatetimes, dtNext];
        const halvingDiffDays = [];
        for (let i = 0; i < dts.length - 1; i++) {
          halvingDiffDays.push(diffDays(dts[i], dts[i + 1]));
        }

        const traces = [
          {
            x: dates,
            y: closes,
            type: 'scatter',
            mode: 'lines',
            name: '가격 (USD)',
            line: { color: 'black' },
          },
        ];
        const shapes = [];
        const annotations = [];

        const dts2 = [...halvingDatetimes, dtNext];
        for (let i = 0; i < dts2.length; i++) {
          const idx = i + 1;
          const dt = dts2[i];
          const d = formatUtcDate(dt);

          // 1. 반감기 라인 + 텍스트
          shapes.push({
            type: 'line',
            x0: d,
            y0: minClose,
            x1: d,
            y1: maxClose,
            line: { color: '#d0d0d0', width: 2 },
            layer: 'below',
          });
          traces.push({
            x: [d],
            y: [maxClose * 1.1],
            text: [idx === 5 ? '5번째 반감기(예상)' : `${idx}번째 반감기`],
            type: 'scatter',
            mode: 'text',
            showlegend: false,
          });
          annotations.push({
            x: d,
            y: 0.001,
            text: d,
            showarrow: false,
            align: 'center',
            textangle: -90,
            yanchor: 'top',
            font: { color: 'rgb(0,0,0)', size: 12 },
          });

          if (idx === 5) break;

          const totalDays = halvingDiffDays[idx];
          const q = Math.floor(totalDays / 4);
          const qq = Math.floor(totalDays / 8);
          const y = 10 / 4;

          // 2. Market peak (sell)
          const sellD1 = formatUtcDate(addDays(dt, q));
          const sellD2 = formatUtcDate(addDays(dt, q + qq));
          const sellTextD = formatUtcDate(addDays(dt, q + qq - 90));

          shapes.push({
            type: 'rect',
            x0: sellD1,
            y0: minClose,
            x1: sellD2,
            y1: maxClose,
            fillcolor: '#f0cccc',
            line: { width: 0 },
            layer: 'below',
          });
          traces.push({
            x: [sellTextD],
            y: [y * 2 / 1.7],
            text: ['매도'],
            type: 'scatter',
            mode: 'text',
            showlegend: false,
          });
          for (const ad of [sellD1, sellD2]) {
            annotations.push({
              x: ad,
              y: 0.001,
              text: ad,
              showarrow: false,
              align: 'center',
              textangle: -90,
              yanchor: 'top',
              font: { color: 'rgb(30,30,30)', size: 12 },
            });
          }
          shapes.push({
            type: 'rect',
            x0: sellD1,
            y0: y,
            x1: sellD2,
            y1: y * 1.5,
            line: { color: '#ff0000', width: 2 },
          });

          // 3. Market low (buy)
          const buyD1 = formatUtcDate(addDays(dt, 2 * q + qq));
          const buyD2 = formatUtcDate(addDays(dt, 3 * q));
          const buyTextD = formatUtcDate(addDays(dt, 3 * q - 90));

          shapes.push({
            type: 'rect',
            x0: buyD1,
            y0: minClose,
            x1: buyD2,
            y1: maxClose,
            fillcolor: '#ccf0cc',
            line: { width: 0 },
            layer: 'below',
          });
          traces.push({
            x: [buyTextD],
            y: [y * 2 / 1.7],
            text: ['매수'],
            type: 'scatter',
            mode: 'text',
            showlegend: false,
          });
          for (const ad of [buyD1, buyD2]) {
            annotations.push({
              x: ad,
              y: 0.001,
              text: ad,
              showarrow: false,
              align: 'center',
              textangle: -90,
              yanchor: 'top',
              font: { color: 'rgb(30,30,30)', size: 12 },
            });
          }
          shapes.push({
            type: 'rect',
            x0: buyD1,
            y0: y,
            x1: buyD2,
            y1: y * 1.5,
            line: { color: '#00dd00', width: 2 },
          });

          // 4. Grey bars
          for (let j = 0; j < 8; j++) {
            if (j === 2 || j === 5) continue;
            const gD1 = formatUtcDate(addDays(dt, qq * j));
            const gD2 = formatUtcDate(addDays(dt, qq * (j + 1)));
            shapes.push({
              type: 'rect',
              x0: gD1,
              y0: y,
              x1: gD2,
              y1: y * 1.5,
              line: { color: '#606060', width: 1 },
              fillcolor: '#eeeeee',
              layer: 'below',
            });
          }
        }

        const layout = {
          height: 900,
          paper_bgcolor: '#ffffff',
          plot_bgcolor: '#e5ecf6',
          xaxis: { gridcolor: '#ffffff' },
          yaxis: { type: 'log', gridcolor: '#ffffff' },
          shapes,
          annotations,
        };

        Plotly.newPlot('graph', traces, layout, { responsive: true });
      }

      async function init() {
        const ts = Math.floor(Date.now() / 1000);
        const metaResp = await fetch(`data/meta.json?t=${ts}`, { cache: 'no-store' });
        const meta = await metaResp.json();

        document.getElementById('next-halving').textContent = meta.next_halving;
        document.getElementById('updated-at').textContent = meta.updated_at;

        const [historyResp, recentResp] = await Promise.all([
          fetch(`data/prices_history.csv?v=${meta.history_year}`),
          fetch(`data/prices_recent.csv?t=${ts}`, { cache: 'no-store' }),
        ]);

        const [historyText, recentText] = await Promise.all([
          historyResp.text(),
          recentResp.text(),
        ]);

        const map = new Map();
        for (const [d, c] of parseCsv(historyText)) map.set(d, c);
        for (const [d, c] of parseCsv(recentText)) map.set(d, c);

        const rows = Array.from(map.entries()).sort((a, b) => a[0].localeCompare(b[0]));
        buildChart(rows, meta.next_halving);
      }

      init().catch(err => {
        console.error(err);
        document.getElementById('graph').textContent = '차트 데이터를 불러오지 못했습니다.';
      });
    </script>
</body>
</html>
